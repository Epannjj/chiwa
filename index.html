<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiwa WebDesign</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 30px;
            background: #f4f4f4;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
        }

        .garistigabar {
            display: none;
            width: 30px;
            height: 22px;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            margin-left: auto;
            margin-right: 10px;
        }

        .garistigabar span {
            display: block;
            width: 100%;
            height: 3px;
            background: #333;
            border-radius: 2px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 600;
        }

        .hero {
            padding: 40px 20px;
            text-align: center;
        }

        .hero h2 {
            margin: 0;
            color: #222;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-wrap: wrap;
            }

            .garistigabar {
                display: flex;
            }

            .nav-links {
                display: none;
                width: 100%;
                flex-direction: column;
                gap: 20px;
                padding-top: 10px;
            }

            .nav-links.active {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Chiwa WebDesign</div>

        <div class="garistigabar" aria-label="menu" id="menuToggle">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <ul class="nav-links" id="navLinks">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <div class="hero">
        <h2>Kami dari chiwa selamat datang di website kami</h2>
    </div>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');

        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    </script>
</body>
</html>
